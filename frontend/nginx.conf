server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in the Server header.
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_types text/css application/javascript application/json text/plain text/xml;
    gzip_min_length 1000;
    gzip_proxied any;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing - return index.html for all non-file requests
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # /api/* never reaches this server: Caddy sends it straight to the API
    # (see the Caddyfile), which is also what the API's rate limits rely on.

    # Health check endpoint
    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # Security headers
    add_header Cache-Control "public" always;
}
