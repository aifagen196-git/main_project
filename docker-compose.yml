version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: ${VITE_API_URL}
    container_name: aifagen-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - aifagen-network
    labels:
      - "com.example.description=AIFAGen Frontend"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aifagen-backend
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - aifagen-network
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    labels:
      - "com.example.description=AIFAGen Backend API"
    volumes:
      - backend-logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode);})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2.8-alpine
    container_name: aifagen-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - aifagen-network
    environment:
      - DOMAIN=${DOMAIN:-aifagenlabs.com}
      - API_DOMAIN=${API_DOMAIN:-api.aifagenlabs.com}
    labels:
      - "com.example.description=AIFAGen Reverse Proxy & TLS"
    depends_on:
      - frontend
      - backend

networks:
  aifagen-network:
    driver: bridge

volumes:
  backend-logs:
  caddy-data:
  caddy-config:
