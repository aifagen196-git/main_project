# Runs on every push and pull request. No database or keys needed: the unit
# tests use dummy settings, and the build checks that the site compiles.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      # The unit tests also import small shared files from frontend/src.
      - run: npm ci
        working-directory: frontend
      - run: npm test
      # Ranking check: relevant jobs must still outrank irrelevant ones.
      - run: npm run test:matching

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
